name: Actualizar y Publicar Radar

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ejecutar el radar
        id: pipeline
        continue-on-error: true
        run: dotnet run --project src/RadarOfertasMultinucleo --configuration Release -- --mode parallel --source live
        timeout-minutes: 360

      - name: Conservar la última publicación si falla la captura
        if: steps.pipeline.outcome == 'failure'
        run: echo "::warning::Falló una o más fuentes; se publicará el último catálogo válido del repositorio."

      - name: Publicar cambios de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos publicados del radar"
            git pull --rebase origin main
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir carpeta web
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
