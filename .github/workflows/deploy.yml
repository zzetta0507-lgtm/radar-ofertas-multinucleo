name: Actualizar y Publicar Radar

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # AQUÍ CONECTAREMOS EL PIPELINE EN C# O PYTHON

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir carpeta web
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
